<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiber Pulse</title>
<meta name="description" content="The Fiber payment network on CKB, live: its nodes, its public channels, and every channel opened or closed on chain.">
<meta name="theme-color" content="#07090a">
<meta name="build" content="__BUILD__">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CKB Pulse">
<meta property="og:title" content="Fiber Pulse">
<meta property="og:description" content="The Fiber payment network on CKB, live: its nodes, its public channels, and every channel opened or closed on chain.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%23cbf34d'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%2337401f'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%2337401f'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23cbf34d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fiber.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="live" id="live"></span><div><h1>Fiber Pulse</h1><p data-t="fb.tagline"></p></div></div>
    <nav class="right">
      <div class="seg" id="nets" role="group" data-t-label="fb.net"><button type="button" data-net="mainnet" data-t="fb.mainnet"></button><button type="button" data-net="testnet" data-t="fb.testnet"></button></div>
      <div class="seg small" role="group" aria-label="Language / 语言 / Língua"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh" lang="zh-CN">中文</button><button type="button" data-lang="pt">PT</button></div>
      <a class="to-ckb" href="./" data-t="fb.toCkb"></a>
    </nav>
  </header>

  <section class="stats" id="stats"></section>

  <div class="main">
    <div class="stage" id="stage">
      <canvas id="graph" role="img" data-t-label="fb.map"></canvas>
      <p class="now" id="now" hidden></p>
      <p class="empty" id="empty" hidden></p>
      <div class="tip" id="tip" hidden></div>
      <p class="hint" data-t="fb.hint"></p>
    </div>
    <aside class="panel" id="panel">
      <div id="detail" hidden></div>
      <section>
        <h3 data-t="fb.latest"></h3>
        <p class="day" id="day"></p>
        <ol class="feed" id="feed"></ol>
        <button type="button" class="more" id="more" hidden></button>
      </section>
      <div id="overview"></div>
    </aside>
  </div>

  <footer class="note"><p data-t="fb.note1"></p><p data-t="fb.note2"></p></footer>
</div>
<div class="toast" id="update" role="status" hidden><span data-t="u.msg"></span><button type="button" id="update-go" data-t="u.go"></button></div>
<p class="sr-only" id="sr" aria-live="polite"></p>
<script src="vendor/d3.min.js"></script>
<script type="module" src="fiber.js"></script>
</body>
</html>
