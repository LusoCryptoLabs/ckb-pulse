name: coverage

# Once a month: how much CKB work on GitHub Pulse follows (scripts/coverage.mjs). The answer is in the run summary.

on:
  schedule:
    - cron: '20 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/coverage.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
