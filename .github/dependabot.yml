version: 2
updates:
  # Only security updates for packages: open-pull-requests-limit 0 turns off version updates.
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
