# The old address, pulse-lab.lusocryptolabs.com (2026-11-18). It holds no page. A browser gets a small page that carries its
# settings to the new address (migrate.mjs, installed as /var/www/pulse-legacy/migrate.html); anything else (a crawler, a
# link preview, a feed reader, an API client, curl) gets a permanent redirect that keeps the path and the query. A request
# that is not a GET or a HEAD gets 308, so its method and body survive (an MCP client posting to /mcp).
# Installed by hand as /etc/nginx/sites-enabled/zz_pulse-lab_legacy_redirect.conf. The new address is the app's own domain,
# written by the controller. This file is not touched by a deploy.
map "$http_accept|$http_user_agent" $pulse_legacy_browser {
    default 0;
    "~*(bot|crawl|spider|slurp|facebookexternalhit|telegram|whatsapp|slack|discord|preview|curl|wget|python|node|go-http|java|okhttp|feedly|inoreader|newsblur|feed)" 0;
    "~*text/html.*\|.*mozilla" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name pulse-lab.lusocryptolabs.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # through https first, so that a browser meets the page that carries its settings
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pulse-lab.lusocryptolabs.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pulse-lab.lusocryptolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse-lab.lusocryptolabs.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location = /migrate.html {
        internal;
        root /var/www/pulse-legacy;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        if ($pulse_legacy_browser) {
            rewrite ^ /migrate.html last;
        }
        if ($request_method !~ ^(GET|HEAD)$) {
            return 308 https://pulse.lusocryptolabs.com$request_uri;
        }
        return 301 https://pulse.lusocryptolabs.com$request_uri;
    }
}
